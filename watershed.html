<html lang="ja">
<head>

<title>もりみえる 流域マップ — 山・森・水のつながりを見える化</title>
<meta name="description" content="日本全国 7,941 の流域と 13,611 の山頂を 3D で可視化。それぞれの「公益機能スコア」（CO₂ 吸収・水源涵養・生物多様性）を量化し、ハザードマップと重ねて見られる、もりみえるの流域マップ。">
<meta property="og:title" content="もりみえる 流域マップ">
<meta property="og:description" content="日本全国の流域と山頂を 3D で可視化。森の公益機能スコア × ハザードマップ。">

<style>
:root {
  --green-900: #1f3d2a;
  --green-700: #2d5a3d;
  --green-500: #5a8a3a;
  --green-300: #a7c498;
  --green-100: #e7efde;
  --earth-600: #8c5a3a;
  --earth-500: #c47a4a;
  --earth-300: #e6c4a0;
  --blue-700: #3b6da1;
  --blue-300: #7fadda;
  --cream: #faf6ef;
  --paper: #ffffff;
  --ink-900: #2a2820;
  --ink-700: #4a4838;
  --ink-500: #7a786a;
  --ink-300: #bcbaae;
  --shadow-sm: 0 1px 3px rgba(31,61,42,.08);
  --shadow-md: 0 4px 16px rgba(31,61,42,.10);
  --shadow-lg: 0 12px 40px rgba(31,61,42,.14);
  --radius-sm: 8px;
  --radius-md: 14px;
  --font-jp: 'Noto Sans JP', system-ui, sans-serif;
  --font-display: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
  --font-en: 'Josefin Sans', 'M PLUS Rounded 1c', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font-jp); color: var(--ink-900); background: var(--cream); overflow: hidden; }

#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 1000;
  display: flex; align-items: center; gap: 18px;
  padding: 0 22px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--ink-300);
}
.brand { display: flex; align-items: baseline; gap: 6px; text-decoration: none; }
.brand .logo-mark { font-size: 22px; line-height: 1; transform: translateY(2px); }
.brand .logo-text { font-family: var(--font-display); font-weight: 900; font-size: 18px; color: var(--green-900); letter-spacing: 0.02em; }
.brand .logo-en { font-family: var(--font-en); font-weight: 500; font-size: 12px; color: var(--ink-500); letter-spacing: 0.15em; }
.brand .logo-divider { color: var(--ink-300); margin: 0 4px; font-weight: 300; }
.brand .page-label { font-family: var(--font-display); font-weight: 500; font-size: 13px; color: var(--green-700); }
.nav-link {
  margin-left: auto; font-size: 14px; color: var(--ink-700); text-decoration: none;
  padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--ink-300);
  transition: all .15s;
}
.nav-link:hover { border-color: var(--green-700); color: var(--green-700); }

#map { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; }

/* 上部中央 選択中ピル — 流域を選ぶと出る軽量フィードバック */
.selection-pill {
  position: fixed; top: 72px; left: 50%; transform: translate(-50%, -16px);
  z-index: 900;
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(10px);
  border-radius: 999px;
  padding: 5px 6px 5px 5px;
  box-shadow: 0 6px 24px rgba(31,61,42,0.18);
  font-family: var(--font-jp);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.selection-pill.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.selection-pill .clear {
  width: 28px; height: 28px; border-radius: 50%;
  border: none; background: var(--green-100); color: var(--green-900);
  font-size: 16px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s;
}
.selection-pill .clear:hover { background: #d8e8d2; }
.selection-pill .label {
  font-size: 11px; color: var(--ink-500);
  font-family: var(--font-en); letter-spacing: .12em;
  padding-left: 6px;
}
.selection-pill .value {
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
  color: var(--green-900);
  padding-right: 14px;
}
.selection-pill .badge {
  font-size: 11px; font-family: var(--font-mono);
  color: var(--green-700); background: var(--green-100);
  padding: 3px 9px; border-radius: 999px; margin-right: 6px;
}

/* 下部中央 モード切替ピル */
.mode-bar {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  z-index: 800;
  background: rgba(20,28,22,0.88);
  backdrop-filter: blur(14px);
  border-radius: 999px;
  padding: 5px;
  display: flex; gap: 2px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}
.mode-bar button {
  border: none; background: transparent;
  color: rgba(255,255,255,0.78);
  font-family: var(--font-display); font-weight: 600; font-size: 13px;
  padding: 9px 20px; border-radius: 999px; cursor: pointer;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.mode-bar button:hover { color: #fff; }
.mode-bar button.active {
  background: #ffffff; color: var(--green-900);
}

/* 右上 ミニ凡例 */
.mini-legend {
  position: fixed; top: 76px; right: 18px; z-index: 700;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  padding: 10px 14px;
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
  font-size: 11px;
  max-width: 220px;
}
.mini-legend.hidden-when-detail { display: block; }
.detail-panel.open ~ .mini-legend { display: none; }
.mini-legend h4 {
  margin: 0 0 6px; font-family: var(--font-display);
  font-size: 11px; color: var(--green-700); letter-spacing: .08em;
}
.mini-legend .row {
  display: flex; align-items: center; gap: 8px;
  margin: 4px 0; color: var(--ink-700);
}
.mini-legend .dot {
  width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid #c47a4a; background: #fff;
}
.mini-legend .line-acc {
  width: 18px; height: 3px; border-radius: 999px; background: #d4ff3a;
  box-shadow: 0 0 8px rgba(212,255,58,0.6);
}

.detail-panel {
  position: fixed; top: 76px; right: 18px; z-index: 800;
  width: 360px; max-height: calc(100vh - 100px);
  background: var(--paper);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
  transform: translateX(calc(100% + 36px));
  transition: transform .35s cubic-bezier(.16,1,.3,1);
  overflow: hidden;
}
.detail-panel.open { transform: translateX(0); }
.detail-head {
  padding: 18px 22px 16px;
  border-bottom: 1px solid var(--ink-300);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.detail-badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  letter-spacing: .12em; color: var(--blue-700);
  background: #e8f0fa; padding: 4px 10px; border-radius: 999px;
  font-family: var(--font-en);
}
.detail-badge.peak { color: var(--earth-600); background: #faeede; }
.detail-title { margin: 8px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--green-900); }
.detail-close {
  border: none; background: none; cursor: pointer; font-size: 24px; line-height: 1;
  color: var(--ink-500); padding: 0 4px;
}
.detail-close:hover { color: var(--green-900); }
.detail-body { flex: 1; overflow-y: auto; padding: 18px 22px 22px; }

.score-card {
  background: linear-gradient(180deg, var(--paper), var(--green-100));
  border-left: 4px solid var(--green-700);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 16px;
}
.score-card .total {
  font-family: var(--font-display); font-weight: 900; font-size: 42px;
  color: var(--green-700); line-height: 1;
}
.score-card .total .unit { font-size: 18px; color: var(--ink-500); font-weight: 400; margin-left: 4px; }
.score-card .label { font-size: 11px; color: var(--ink-500); letter-spacing: .12em; font-family: var(--font-en); }

.score-bars { display: grid; gap: 10px; margin-top: 14px; }
.score-bar-row { display: grid; grid-template-columns: 90px 1fr 40px; align-items: center; gap: 10px; font-size: 12px; }
.score-bar-row .name { color: var(--ink-700); }
.score-bar-row .num { text-align: right; font-family: var(--font-mono); color: var(--ink-700); }
.score-bar-row .bar {
  height: 8px; border-radius: 999px;
  background: var(--ink-300); overflow: hidden;
}
.score-bar-row .bar > .fill { height: 100%; background: var(--green-500); border-radius: 999px; }
.score-bar-row.co2 .bar > .fill { background: var(--green-700); }
.score-bar-row.water .bar > .fill { background: var(--blue-700); }
.score-bar-row.bio .bar > .fill { background: var(--earth-500); }

.detail-section { margin: 16px 0; padding-top: 14px; border-top: 1px dashed var(--ink-300); }
.detail-section:first-child { padding-top: 0; border-top: none; }
.detail-section h4 {
  margin: 0 0 8px; font-family: var(--font-display);
  font-size: 11px; font-weight: 700; letter-spacing: .12em;
  color: var(--green-700);
}
.detail-section dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
.detail-section dt { color: var(--ink-500); font-weight: 500; }
.detail-section dd { margin: 0; color: var(--ink-900); font-family: var(--font-mono); }

.peak-list { list-style: none; padding: 0; margin: 0; }
.peak-list li {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 6px 0; border-bottom: 1px solid var(--ink-300);
  font-size: 13px; cursor: pointer;
  transition: background .12s;
}
.peak-list li:hover { background: var(--cream); }
.peak-list li:last-child { border-bottom: none; }
.peak-list .pn { font-weight: 600; color: var(--green-900); }
.peak-list .pm { font-family: var(--font-mono); font-size: 11px; color: var(--ink-500); }
.peak-list .ps { font-family: var(--font-mono); font-size: 11px; color: var(--green-700); font-weight: 600; }

.bottom-bar {
  position: fixed; bottom: 8px; left: 18px; z-index: 700;
  font-size: 10px; color: var(--ink-500);
  background: rgba(255,255,255,.84);
  padding: 4px 10px; border-radius: 999px;
  font-family: var(--font-mono);
  max-width: 80vw;
}
.bottom-bar a { color: var(--ink-700); text-decoration: underline dotted; }

@media (max-width: 720px) {
  .mini-legend { top: auto; bottom: 100px; right: 14px; max-width: 200px; }
  .mode-bar { bottom: 18px; }
  .mode-bar button { padding: 8px 14px; font-size: 12px; }
  .detail-panel { width: calc(100vw - 28px); top: auto; bottom: 86px; right: 14px; left: 14px; max-height: 55vh; transform: translateY(calc(100% + 100px)); }
  .detail-panel.open { transform: translateY(0); }
}

<script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
<script src="config.js"></script>
<script>
// ====== Mapbox GL JS — 3D 流域マップ ======
// Token は config.js (gitignore) または config.example.js (placeholder) から読む
mapboxgl.accessToken = window.MAPBOX_TOKEN || '';
if (!mapboxgl.accessToken) {
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#fef0e3;border:1px solid #c47a4a;padding:14px 22px;border-radius:10px;z-index:9999;max-width:500px;font-size:13px;">' +
    '⚠️ Mapbox token が設定されていません。<code>config.js</code> を作成して <code>window.MAPBOX_TOKEN</code> を設定してください。' +
    '</div>');
}
const map = new mapboxgl.Map({
  container: 'map',
  hash: true,
  center: [138.73, 35.36],     // 富士山真上
  zoom: 12,
  pitch: 55,
  bearing: -18,
  maxPitch: 80,
  style: 'mapbox://styles/mapbox/satellite-streets-v12',
  projection: 'mercator',
});
map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(new mapboxgl.ScaleControl({ maxWidth: 120, unit: 'metric' }), 'bottom-right');

let watershedsGJ = null;
let peaksGJ = null;
let selectedHybas = null;

function scoreToColor(score) {
  // Quantile-ish ramp (mean 26, top 80+ = 1.4%):
  // 0–10 sand → 10–25 light yellow-green → 25–45 sage → 45–65 mid green → 65–80 deep green → 80+ forest
  if (score < 10) return '#f4ecd5';
  if (score < 25) return '#dfe3a8';
  if (score < 45) return '#a7c498';
  if (score < 65) return '#5a8a3a';
  if (score < 80) return '#2d5a3d';
  return '#1f3d2a';
}

map.on('load', async () => {
  // ----- 3D terrain (Mapbox terrain-rgb) + cinematic fog -----
  map.addSource('mapbox-dem', {
    type: 'raster-dem',
    url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
    tileSize: 512,
    maxzoom: 14,
  });
  map.setTerrain({ source: 'mapbox-dem', exaggeration: 1.2 });

  // ズーム連動 fog ─ 低ズームは暗く荘厳、高ズームは明るく地表に降りた感じ。
  map.setFog({
    'range': [0, 12],
    'horizon-blend': ['interpolate', ['linear'], ['zoom'], 5.5, 0.02, 8, 0.12],
    'color':       ['interpolate', ['linear'], ['zoom'], 5.5, 'hsl(40, 8%, 16%)', 7.5, 'hsl(40, 60%, 92%)'],
    'high-color':  ['interpolate', ['linear'], ['zoom'], 5.5, 'hsl(220, 30%, 12%)', 7.5, 'hsl(210, 55%, 78%)'],
    'space-color': ['interpolate', ['linear'], ['zoom'], 5.5, 'hsl(220, 20%, 5%)',  7.5, 'hsl(200, 60%, 80%)'],
    'star-intensity': ['interpolate', ['linear'], ['zoom'], 5.5, 0.35, 7, 0],
  });

  // 河川・水域の強調（Mapbox satellite-streets-v12 の composite に既に入ってる waterway/water を上書き）
  // Mapbox 標準スタイルの id は固定なので setPaintProperty で色味だけ振り直す。
  for (const id of ['waterway', 'waterway-shadow', 'water', 'water-shadow']) {
    if (!map.getLayer(id)) continue;
    if (id.startsWith('water') && map.getLayer(id) && map.getPaintProperty(id, 'fill-color') !== undefined) {
      map.setPaintProperty(id, 'fill-color', '#4ea7c9');
      map.setPaintProperty(id, 'fill-opacity', 0.55);
    }
    if (id.startsWith('waterway') && map.getPaintProperty(id, 'line-color') !== undefined) {
      map.setPaintProperty(id, 'line-color', '#5bc4e8');
      map.setPaintProperty(id, 'line-opacity', 0.9);
    }
  }

  // ----- watersheds -----
  watershedsGJ = await fetch('data/watersheds/japan_lev10_scored.geojson').then(r => r.json());
  for (const f of watershedsGJ.features) {
    const s = f.properties.scores.total;
    f.properties._fill = scoreToColor(s);
    f.properties._height = Math.max(200, s * 60);  // 0–100 → 200–6000m 浮き上がり
  }
  map.addSource('watersheds', { type: 'geojson', data: watershedsGJ, promoteId: 'hybas_id' });
  // Transparent fill — used ONLY for click target.
  map.addLayer({
    id: 'watershed-fill',
    type: 'fill',
    source: 'watersheds',
    paint: { 'fill-color': '#000000', 'fill-opacity': 0 },
  });
  // 通常の流域線：白に近い淡色で衛星上に「水墨画」的に乗せる。
  // 選択時のみ蛍光イエローグリーンで強くハイライト。
  map.addLayer({
    id: 'watershed-line',
    type: 'line',
    source: 'watersheds',
    paint: {
      'line-color': ['case',
        ['boolean', ['feature-state', 'selected'], false], '#d4ff3a',
        'rgba(255,255,255,0.55)'
      ],
      'line-width': ['case',
        ['boolean', ['feature-state', 'selected'], false], 3,
        ['interpolate', ['linear'], ['zoom'], 6, 0.35, 10, 0.7, 14, 1.2]
      ],
      'line-opacity': ['case',
        ['boolean', ['feature-state', 'selected'], false], 1, 0.6
      ],
    },
  });
  // 選択中の流域 内側にもう一本ぼかし線（グロー風） — 衛星上で蛍光感を出す
  map.addLayer({
    id: 'watershed-line-glow',
    type: 'line',
    source: 'watersheds',
    paint: {
      'line-color': '#d4ff3a',
      'line-width': ['case', ['boolean', ['feature-state', 'selected'], false], 12, 0],
      'line-opacity': 0.25,
      'line-blur': 6,
    },
  });

  // ----- peaks -----
  peaksGJ = await fetch('data/mountains/japan_peaks.geojson').then(r => r.json());
  // Filter peaks for client perf — keep all but rely on zoom expression for visibility
  map.addSource('peaks', { type: 'geojson', data: peaksGJ });
  // 山頂：衛星上で見やすい小さな白丸＋細い土色アウトライン
  map.addLayer({
    id: 'peak-symbol',
    type: 'circle',
    source: 'peaks',
    paint: {
      'circle-radius': [
        'interpolate', ['linear'], ['zoom'],
        5, 2, 9, 2.6, 13, 4,
      ],
      'circle-color': '#ffffff',
      'circle-stroke-color': '#c47a4a',
      'circle-stroke-width': 1.6,
      'circle-opacity': [
        'interpolate', ['linear'], ['zoom'],
        5, ['case', ['>', ['coalesce', ['get', 'elevation_m'], 0], 2500], 0.95, 0],
        7, ['case', ['>', ['coalesce', ['get', 'elevation_m'], 0], 2000], 0.92, 0],
        9, ['case', ['>', ['coalesce', ['get', 'elevation_m'], 0], 1400], 0.9, 0],
        11, ['case', ['>', ['coalesce', ['get', 'elevation_m'], 0], 800], 0.88, 0],
        13, ['case', ['>', ['coalesce', ['get', 'elevation_m'], 0], 400], 0.9, 0],
        15, 0.92,
      ],
      'circle-stroke-opacity': [
        'interpolate', ['linear'], ['zoom'],
        5, ['case', ['>', ['coalesce', ['get', 'elevation_m'], 0], 2500], 0.95, 0],
        9, ['case', ['>', ['coalesce', ['get', 'elevation_m'], 0], 1400], 0.9, 0],
        11, ['case', ['>', ['coalesce', ['get', 'elevation_m'], 0], 800], 0.88, 0],
        13, 0.9,
      ],
    },
  });
  map.addLayer({
    id: 'peak-label',
    type: 'symbol',
    source: 'peaks',
    minzoom: 9,
    layout: {
      'text-field': ['get', 'name'],
      'text-font': ['Open Sans Semibold', 'Arial Unicode MS Bold'],
      'text-size': 11,
      'text-offset': [0.7, 0],
      'text-anchor': 'left',
      'text-optional': true,
      'text-allow-overlap': false,
    },
    paint: {
      'text-color': '#ffffff',
      'text-halo-color': '#1a2516',
      'text-halo-width': 1.4,
      'text-halo-blur': 0.4,
      'text-opacity': [
        'interpolate', ['linear'], ['zoom'],
        9, ['case', ['>', ['coalesce', ['get', 'elevation_m'], 0], 1500], 0.95, 0],
        12, 0.98,
      ],
    },
  });

  // ----- hazard tiles -----
  map.addSource('haz-flood', {
    type: 'raster',
    tiles: ['https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png'],
    tileSize: 256,
    maxzoom: 17,
    attribution: '洪水浸水想定区域：© 国交省 ハザードマップポータル',
  });
  map.addLayer({
    id: 'haz-flood-layer', type: 'raster', source: 'haz-flood',
    paint: { 'raster-opacity': 0.5 },
    layout: { visibility: 'none' },
  });
  map.addSource('haz-doseki', {
    type: 'raster',
    tiles: ['https://disaportaldata.gsi.go.jp/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png'],
    tileSize: 256,
    maxzoom: 17,
    attribution: '土砂災害警戒区域：© 国交省 ハザードマップポータル',
  });
  map.addLayer({
    id: 'haz-doseki-layer', type: 'raster', source: 'haz-doseki',
    paint: { 'raster-opacity': 0.55 },
    layout: { visibility: 'none' },
  });

  // ----- interactions -----
  map.on('click', 'watershed-fill', (e) => {
    const f = e.features[0];
    showWatershedDetail(f);
    setSelectedHybas(f.properties.hybas_id);
    e.preventDefault?.();
  });
  map.on('click', 'peak-symbol', (e) => {
    if (e.originalEvent.defaultPrevented) return;
    const f = e.features[0];
    showPeakDetail(f);
    e.preventDefault?.();
  });
  map.on('click', (e) => {
    // empty-area click closes panel
    const feats = map.queryRenderedFeatures(e.point, { layers: ['watershed-fill', 'peak-symbol'] });
    if (feats.length === 0) {
      closeDetail();
      setSelectedHybas(null);
    }
  });
  map.on('mouseenter', 'watershed-fill', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'watershed-fill', () => map.getCanvas().style.cursor = '');
  map.on('mouseenter', 'peak-symbol', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'peak-symbol', () => map.getCanvas().style.cursor = '');
});

function setSelectedHybas(id) {
  if (selectedHybas !== null && selectedHybas !== id) {
    map.setFeatureState({ source: 'watersheds', id: selectedHybas }, { selected: false });
  }
  selectedHybas = id;
  if (id !== null) {
    map.setFeatureState({ source: 'watersheds', id }, { selected: true });
  } else {
    hideSelectionPill();
  }
}

function showSelectionPill(props, kind) {
  const pill = document.getElementById('selection-pill');
  document.getElementById('selection-badge').textContent = kind === 'peak' ? '山頂' : '流域';
  const value = kind === 'peak'
    ? `${props.name}${props.elevation_m ? `（${props.elevation_m}m）` : ''}`
    : `${props.main_pref_name || '?'} 流域 #${props.hybas_id}`;
  document.getElementById('selection-value').textContent = value;
  pill.classList.add('show');
}
function hideSelectionPill() {
  document.getElementById('selection-pill').classList.remove('show');
}

function showWatershedDetail(feature) {
  const p = feature.properties;
  showSelectionPill(p, 'watershed');
  // properties may be stringified by MapLibre
  const scores = typeof p.scores === 'string' ? JSON.parse(p.scores) : p.scores;
  const top_peaks = typeof p.top_peaks === 'string' ? JSON.parse(p.top_peaks) : (p.top_peaks || []);
  const bid = p.hybas_id;
  const peakRows = top_peaks.map(pk => `
    <li onclick="flyToPeak(${pk.lon},${pk.lat},'${pk.name.replace(/'/g, "\\'")}')">
      <span class="pn">${pk.name}</span>
      <span class="pm">${pk.elevation_m ? pk.elevation_m + 'm' : ''}</span>
      <span class="ps">★${pk.score}</span>
    </li>
  `).join('');
  document.getElementById('dp-badge').textContent = '流域';
  document.getElementById('dp-badge').className = 'detail-badge';
  document.getElementById('dp-title').textContent = `${p.main_pref_name || '?'} 流域（${p.hybas_id}）`;
  document.getElementById('dp-body').innerHTML = `
    <div class="score-card">
      <p class="label">PUBLIC GOOD SCORE</p>
      <p class="total">${scores.total}<span class="unit">/100</span></p>
      <div class="score-bars">
        <div class="score-bar-row co2"><span class="name">CO₂ 吸収</span><span class="bar"><span class="fill" style="width:${scores.co2}%"></span></span><span class="num">${scores.co2}</span></div>
        <div class="score-bar-row water"><span class="name">水源涵養</span><span class="bar"><span class="fill" style="width:${scores.water}%"></span></span><span class="num">${scores.water}</span></div>
        <div class="score-bar-row bio"><span class="name">生物多様性</span><span class="bar"><span class="fill" style="width:${scores.bio}%"></span></span><span class="num">${scores.bio}</span></div>
      </div>
    </div>
    <div class="detail-section">
      <h4>流域の基本情報</h4>
      <dl>
        <dt>主要県</dt><dd>${p.main_pref_name || '-'}</dd>
        <dt>面積</dt><dd>${p.area_sqkm} km²</dd>
        <dt>上流面積</dt><dd>${p.up_area_sqkm?.toLocaleString() || '-'} km²</dd>
        <dt>森林率</dt><dd>${Math.round(p.forest_pct * 100)}%</dd>
        <dt>CO₂/ha/年</dt><dd>${p.co2_per_ha_yr} t</dd>
        <dt>自然公園 重複</dt><dd>${p.park_overlap_pct}%</dd>
        <dt>山頂数</dt><dd>${p.peak_count} 座</dd>
        <dt>最高点</dt><dd>${p.max_elev_m ? p.max_elev_m + ' m' : '-'}</dd>
      </dl>
    </div>
    ${peakRows ? `<div class="detail-section">
      <h4>含む山頂（スコア上位）</h4>
      <ul class="peak-list">${peakRows}</ul>
    </div>` : ''}
    <div class="detail-section">
      <h4>下流・上流</h4>
      <dl>
        <dt>下流流域 ID</dt><dd>${p.next_down || '海/沈降地'}</dd>
        <dt>最終排出</dt><dd>${p.next_sink || '-'}</dd>
        <dt>Pfafstetter</dt><dd>${p.pfaf_id}</dd>
      </dl>
      ${p.next_down ? `<button onclick="focusBasin(${p.next_down})" style="margin-top:8px;padding:6px 12px;border:1px solid var(--ink-300);background:var(--cream);border-radius:8px;font-size:12px;cursor:pointer;">↓ 下流流域へ</button>` : ''}
    </div>
  `;
  openDetail();
}

function showPeakDetail(feature) {
  const p = feature.properties;
  const scores = typeof p.scores === 'string' ? JSON.parse(p.scores) : p.scores;
  showSelectionPill(p, 'peak');
  document.getElementById('dp-badge').textContent = '山頂';
  document.getElementById('dp-badge').className = 'detail-badge peak';
  document.getElementById('dp-title').textContent = `${p.name}${p.elevation_m ? `（${p.elevation_m}m）` : ''}`;
  document.getElementById('dp-body').innerHTML = `
    <div class="score-card">
      <p class="label">PUBLIC GOOD SCORE</p>
      <p class="total">${scores.total}<span class="unit">/100</span></p>
      <div class="score-bars">
        <div class="score-bar-row co2"><span class="name">CO₂ 吸収</span><span class="bar"><span class="fill" style="width:${scores.co2}%"></span></span><span class="num">${scores.co2}</span></div>
        <div class="score-bar-row water"><span class="name">水源涵養</span><span class="bar"><span class="fill" style="width:${scores.water}%"></span></span><span class="num">${scores.water}</span></div>
        <div class="score-bar-row bio"><span class="name">生物多様性</span><span class="bar"><span class="fill" style="width:${scores.bio}%"></span></span><span class="num">${scores.bio}</span></div>
      </div>
    </div>
    <div class="detail-section">
      <h4>山の基本情報</h4>
      <dl>
        <dt>所在</dt><dd>${p.pref_name || '-'}</dd>
        <dt>標高</dt><dd>${p.elevation_m || '-'} m</dd>
        ${p.name_en ? `<dt>英語名</dt><dd>${p.name_en}</dd>` : ''}
        ${p.in_park ? `<dt>保護区</dt><dd>${p.in_park}内</dd>` : ''}
        ${p.nearby_park ? `<dt>近隣保護区</dt><dd>${p.nearby_park}（${p.park_distance_km}km）</dd>` : ''}
        <dt>森林率</dt><dd>${Math.round(p.forest_pct * 100)}%</dd>
      </dl>
    </div>
    <div class="detail-section">
      <h4>含む流域へ</h4>
      <p style="font-size:12px;color:var(--ink-700);margin:0 0 8px;">この山頂が含まれる流域を地図上でフォーカスします。</p>
      <button onclick="focusWatershedAt(${feature.geometry.coordinates[0]},${feature.geometry.coordinates[1]})" style="padding:8px 14px;border:1px solid var(--green-700);background:var(--green-100);color:var(--green-900);border-radius:8px;font-size:12px;cursor:pointer;font-weight:600;">🌊 含む流域を表示</button>
    </div>
    ${p.wikipedia ? `<div class="detail-section"><a href="https://${p.wikipedia.split(':')[0]}.wikipedia.org/wiki/${encodeURIComponent(p.wikipedia.split(':').slice(1).join(':'))}" target="_blank" style="font-size:13px;">Wikipedia で見る →</a></div>` : ''}
  `;
  openDetail();
  // Fly to with appropriate framing
  map.easeTo({ center: feature.geometry.coordinates, zoom: Math.max(map.getZoom(), 10), pitch: 60, duration: 1200 });
}

function flyToPeak(lon, lat, name) {
  map.easeTo({ center: [lon, lat], zoom: 11, pitch: 60, duration: 1500 });
  // After fly, try to open peak detail
  setTimeout(() => {
    const pt = map.project([lon, lat]);
    const feats = map.queryRenderedFeatures(pt, { layers: ['peak-symbol'] });
    if (feats.length) showPeakDetail(feats[0]);
  }, 1600);
}

function focusBasin(hybas_id) {
  if (!watershedsGJ) return;
  const target = watershedsGJ.features.find(f => f.properties.hybas_id === hybas_id);
  if (!target) return;
  const b = turfBbox(target);
  map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 80, pitch: 50, duration: 1500 });
  setSelectedHybas(hybas_id);
  showWatershedDetail({ properties: target.properties });
}

function focusWatershedAt(lon, lat) {
  if (!watershedsGJ) return;
  // Find a watershed containing this point (point-in-polygon)
  for (const f of watershedsGJ.features) {
    if (pointInGeom([lon, lat], f.geometry)) {
      const b = turfBbox(f);
      map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 80, pitch: 50, duration: 1500 });
      setSelectedHybas(f.properties.hybas_id);
      setTimeout(() => showWatershedDetail({ properties: f.properties }), 200);
      return;
    }
  }
}

// Light-weight ray-casting point-in-polygon (handles Polygon + MultiPolygon)
function pointInGeom(pt, geom) {
  if (geom.type === 'Polygon') return pointInRings(pt, geom.coordinates);
  if (geom.type === 'MultiPolygon') return geom.coordinates.some(rings => pointInRings(pt, rings));
  return false;
}
function pointInRings(pt, rings) {
  let inside = pointInRing(pt, rings[0]);
  for (let i = 1; i < rings.length; i++) {
    if (pointInRing(pt, rings[i])) inside = !inside; // holes
  }
  return inside;
}
function pointInRing(pt, ring) {
  const [x, y] = pt;
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i];
    const [xj, yj] = ring[j];
    const cross = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi + 1e-12) + xi);
    if (cross) inside = !inside;
  }
  return inside;
}
function turfBbox(feature) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  function ringBbox(ring) {
    for (const [x, y] of ring) {
      if (x < minX) minX = x;
      if (y < minY) minY = y;
      if (x > maxX) maxX = x;
      if (y > maxY) maxY = y;
    }
  }
  const g = feature.geometry;
  if (g.type === 'Polygon') g.coordinates.forEach(ringBbox);
  else if (g.type === 'MultiPolygon') g.coordinates.forEach(p => p.forEach(ringBbox));
  return [minX, minY, maxX, maxY];
}

function openDetail() { document.getElementById('detail-panel').classList.add('open'); }
function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  hideSelectionPill();
  setSelectedHybas(null);
}
window.closeDetail = closeDetail;
document.getElementById('selection-clear').addEventListener('click', () => {
  closeDetail();
});
window.flyToPeak = flyToPeak;
window.focusBasin = focusBasin;
window.focusWatershedAt = focusWatershedAt;

// ----- モード切替 -----
function setLayerVis(lid, on) {
  if (map.getLayer(lid)) map.setLayoutProperty(lid, 'visibility', on ? 'visible' : 'none');
}
function applyMode(mode) {
  // 流域・山頂は全モード ON
  ['watershed-fill','watershed-line','watershed-line-glow','peak-symbol','peak-label'].forEach(l => setLayerVis(l, true));
  // ハザードは ハザード／すべて で ON
  const hazOn = (mode === 'hazard' || mode === 'all');
  setLayerVis('haz-flood-layer', hazOn);
  setLayerVis('haz-doseki-layer', hazOn);
  // active class
  document.querySelectorAll('.mode-bar button').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-' + mode).classList.add('active');
}
map.on('load', () => {
  document.getElementById('mode-standard').addEventListener('click', () => applyMode('standard'));
  document.getElementById('mode-hazard').addEventListener('click', () => applyMode('hazard'));
  document.getElementById('mode-all').addEventListener('click', () => applyMode('all'));
  applyMode('standard');
});
</script>
